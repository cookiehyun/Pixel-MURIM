<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0c0a16">
<title>Pixel Murim</title>
<style>
  html, body { margin: 0; height: 100%; background: #0c0a16; color: #d8cfe8; font-family: monospace;
    overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
  #wrap { display: flex; gap: 24px; flex-direction: column; align-items: center; justify-content: center; height: 100%; }
  #screen { image-rendering: pixelated; image-rendering: crisp-edges; width: min(100vw, calc(100vh * 1.92)); aspect-ratio: 192 / 100; display: block; background: #000; }
  #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
  #touch { display: none; width: 100%; max-width: 900px; justify-content: space-between; align-items: center; padding: 8px 16px 16px; box-sizing: border-box; flex: 1; }
  .dpad { display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(3, 56px); gap: 2px; }
  .btns { display: grid; grid-template-columns: repeat(2, 64px); grid-template-rows: repeat(2, 64px); gap: 10px; position: relative; }
  .b { background: #2a2238; border: 2px solid #5a4a78; border-radius: 10px; display: flex; align-items: center; justify-content: center;
    font-weight: bold; color: #e8dcff; font-size: 18px; }
  .btns .b { border-radius: 50%; }
  .b.c { background: transparent; border-color: transparent; }
  .sys { display: flex; flex-direction: column; gap: 10px; }
  .sys .b { width: 64px; height: 36px; font-size: 13px; }
  @media (pointer: coarse) { #touch { display: flex; } #screen { width: min(100vw, calc(60vh * 1.92)); } }
  @media (pointer: coarse) and (orientation: landscape) {
    #touch { position: absolute; inset: auto 0 0 0; max-width: none; flex: none; pointer-events: none; }
    #touch > * { pointer-events: auto; opacity: .6; }
    #touch .sys { position: fixed; top: 8px; right: 12px; flex-direction: row; }
    #touch .sys .b { width: 56px; height: 28px; font-size: 11px; }
    #screen { width: min(100vw, calc(100vh * 1.92)); }
  }
  #acct { position: fixed; inset: 0; background: rgba(8, 6, 16, .82); display: flex; align-items: center; justify-content: center; z-index: 10; }
  #acct[hidden] { display: none; }
  #acct .card { background: #1a1428; border: 2px solid #e6b450; padding: 18px 20px; width: min(320px, 86vw); display: flex; flex-direction: column; gap: 10px; }
  #acct-title { color: #ffcc5c; font-size: 20px; font-weight: bold; text-align: center; letter-spacing: 2px; }
  #acct label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #a89cc0; }
  #acct input { font: 18px monospace; padding: 8px; background: #0c0a16; color: #fff3d8; border: 1px solid #5a4a78; text-transform: uppercase; }
  #acct input[type=password] { text-transform: none; }
  #acct-msg { min-height: 16px; font-size: 12px; color: #ff9a7a; text-align: center; }
  #acct .row { display: flex; gap: 10px; }
  #acct button { flex: 1; font: bold 15px monospace; padding: 10px; background: #2a2238; color: #e8dcff; border: 2px solid #5a4a78; }
  #acct button#acct-ok { background: #4a3414; border-color: #e6b450; color: #ffecb4; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="screen" width="192" height="100"></canvas>
  <div id="loading">LOADING...</div>
  <div id="acct" hidden>
    <div class="card">
      <div id="acct-title">CREATE ACCOUNT</div>
      <label>ID<input id="acct-id" maxlength="10" autocomplete="username" autocapitalize="characters" spellcheck="false"></label>
      <label>PASSWORD<input id="acct-pw" type="password" autocomplete="current-password"></label>
      <label>PASSWORD AGAIN<input id="acct-pw2" type="password" autocomplete="new-password"></label>
      <div id="acct-msg"></div>
      <div class="row"><button id="acct-cancel">CANCEL</button><button id="acct-ok">CREATE</button></div>
    </div>
  </div>
  <div id="touch">
    <div class="dpad">
      <div class="b" data-btn="0,2">&#8598;</div><div class="b" data-btn="2">&#9650;</div><div class="b" data-btn="1,2">&#8599;</div>
      <div class="b" data-btn="0">&#9664;</div><div class="b c"></div><div class="b" data-btn="1">&#9654;</div>
      <div class="b" data-btn="0,3">&#8601;</div><div class="b" data-btn="3">&#9660;</div><div class="b" data-btn="1,3">&#8600;</div>
    </div>
    <div class="sys">
      <div class="b" data-btn="8">PAUSE</div>
      <div class="b" data-btn="14">TAG</div>
    </div>
    <div class="btns">
      <div class="b" data-btn="4">A</div><div class="b" data-btn="5">S</div>
      <div class="b" data-btn="6">Z</div><div class="b" data-btn="7">X</div>
    </div>
  </div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
